name: iOS 未签名 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 重新生成 Xcode 工程
        env:
          TDS_BUNDLE_IDENTIFIER: com.hanlinzhou.SameDeviceCarPlayPoC
        run: python3 Tools/generate_project.py

      - name: 编译（不签名）
        run: |
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/TDSCarKit.app out/Payload/
          cd out
          zip -qry CarWithin-unsigned.ipa Payload
          shasum -a 256 CarWithin-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CarWithin-unsigned-ipa
          path: out/CarWithin-unsigned.ipa
